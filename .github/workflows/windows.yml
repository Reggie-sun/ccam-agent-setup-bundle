name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-go@v5
        with:
          go-version-file: ccam/go.mod
          cache-dependency-path: ccam/go.sum
      - name: Windows PowerShell 5.1 and Python checks
        shell: powershell
        run: .\verify-windows.ps1
      - name: Go test
        working-directory: ccam
        run: go test ./...
      - name: Go vet
        working-directory: ccam
        run: go vet ./...
      - name: Go build
        working-directory: ccam
        run: go build -pgo=off -o ccam.exe ./cmd/ccam
